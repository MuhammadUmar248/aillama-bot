name: Daily AI Llama Post

on:
  schedule:
    - cron: "0 9 * * *"  # 9:00 AM UTC every day — change to your preferred time
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Poppins font files
        run: |
          mkdir -p fonts
          curl -sSL -o fonts/Poppins-Bold.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf"
          curl -sSL -o fonts/Poppins-SemiBold.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-SemiBold.ttf"
          curl -sSL -o fonts/Poppins-Regular.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Regular.ttf"

      - name: Generate content + slides
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: python generate.py

      - name: Commit generated slides
        run: |
          git config user.name "aillama-bot"
          git config user.email "actions@github.com"
          if [ -f pending_post.json ]; then
            git add images/ pending_post.json
            git commit -m "Add daily carousel slides [skip ci]" || echo "Nothing to commit"
            git push
          else
            echo "No new post generated today."
          fi

      - name: Wait for raw.githubusercontent.com to serve the new images
        if: hashFiles('pending_post.json') != ''
        run: sleep 20

      - name: Publish carousel to Instagram
        if: hashFiles('pending_post.json') != ''
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python publish.py

      - name: Commit updated posted log
        if: always()
        run: |
          git config user.name "aillama-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Update posted log [skip ci]" || echo "Nothing to commit"
          git push
